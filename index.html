<!DOCTYPE html>

<head>

<title>Página do Inspetor</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #263238;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* TOPO */

.topo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 20px;
}

h1 {

}

.subtitulo {

}

.topo-acoes {

    gap: 8px;
    flex-wrap: wrap;
}

.status-login {

}

/* PAINÉIS */

    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

/* FORMULÁRIO */

.form-grid {
    display: grid;

}

label {
    font-size: 13px;
    font-weight: bold;

}

input,
select {
    width: 100%;

}

button {

    padding: 10px 16px;

}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* BOTÕES */

.btn-adicionar {

}

/* =========================================================
   TÉCNICOS
========================================================= */

let tecnicosInspetor = [];
let tecnicosCarregados = false;

async function abrirAbaInspetor(aba) {

    const agendaView = document.getElementById("agendaView");
    const tecnicosView = document.getElementById("tecnicosView");
    const abaAgenda = document.getElementById("abaAgenda");
    const abaTecnicos = document.getElementById("abaTecnicos");

    const mostrarTecnicos = aba === "tecnicos";

    agendaView.classList.toggle("oculto", mostrarTecnicos);
    tecnicosView.classList.toggle("oculto", !mostrarTecnicos);

    abaAgenda.classList.toggle("ativa", !mostrarTecnicos);
    abaTecnicos.classList.toggle("ativa", mostrarTecnicos);

    if (mostrarTecnicos && !tecnicosCarregados) {
        await carregarTecnicosInspetor();
    }
}

async function carregarTecnicosInspetor(forcar = false) {

    if (tecnicosCarregados && !forcar) {
        filtrarTecnicosInspetor();
        return;
    }

    const status = document.getElementById("statusTecnicos");
    status.textContent = "Carregando técnicos da planilha...";
    status.className = "status-conexao aviso-sync";

    try {

        const dados = await apiPost({
            acao: "listarTecnicos"
        });

        if (!dados.sucesso) {
            throw new Error(
                dados.mensagem ||
                "Não foi possível carregar os técnicos."
            );
        }

        tecnicosInspetor =
            Array.isArray(dados.tecnicos)
                ? dados.tecnicos
                : [];

        tecnicosCarregados = true;

        preencherFiltrosTecnicosInspetor();
        atualizarKpisTecnicosInspetor();
        filtrarTecnicosInspetor();

        status.textContent =
            "✓ " + tecnicosInspetor.length +
            " técnico(s) carregado(s).";

        status.className =
            "status-conexao sucesso-sync";

    } catch (erro) {

        console.error(erro);

        status.textContent =
            "⚠ Erro ao carregar os técnicos: " +
            erro.message;

        status.className =
            "status-conexao erro-sync";
    }
}

function preencherFiltrosTecnicosInspetor() {

    const cidade =
        document.getElementById("filtroCidadeTecnicos");

    const status =
        document.getElementById("filtroStatusTecnicos");

    const cidadeAtual = cidade.value;
    const statusAtual = status.value;

    const cidades = [
        ...new Set(
            tecnicosInspetor
                .map(x => x.cidade)
                .filter(Boolean)
        )
    ].sort((a,b) => a.localeCompare(b, "pt-BR"));

    const statuses = [
        ...new Set(
            tecnicosInspetor
                .map(x => x.status)
                .filter(Boolean)
        )
    ].sort((a,b) => a.localeCompare(b, "pt-BR"));

    cidade.innerHTML =
        '<option value="">Todas as cidades</option>';

    status.innerHTML =
        '<option value="">Todos os status</option>';

    cidades.forEach(item => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        cidade.appendChild(option);
    });

    statuses.forEach(item => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        status.appendChild(option);
    });

    cidade.value = cidadeAtual;
    status.value = statusAtual;
}

function filtrarTecnicosInspetor() {

    const pesquisa =
        document.getElementById("pesquisaTecnicos")
            .value.trim().toLowerCase();

    const cidade =
        document.getElementById("filtroCidadeTecnicos")
            .value;

    const status =
        document.getElementById("filtroStatusTecnicos")
            .value;

    const lista = tecnicosInspetor.filter(t => {

        const texto = [
            t.nome,
            t.matricula,
            t.telefone,
            t.cidade
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return (
            (!pesquisa || texto.includes(pesquisa)) &&
            (!cidade || t.cidade === cidade) &&
            (!status || t.status === status)
        );
    });

    renderizarTecnicosInspetor(lista);
}

function obterIniciaisTecnico(nome) {
    const partes = String(nome || "Técnico")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if (!partes.length) return "T";
    if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();

    return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
}

function atualizarKpisTecnicosInspetor() {

    const total = tecnicosInspetor.length;

    const ativos = tecnicosInspetor.filter(t =>
        !String(t.status || "").toUpperCase().includes("DESLIG")
    ).length;

    const cidades = new Set(
        tecnicosInspetor
            .map(t => String(t.cidade || "").trim())
            .filter(Boolean)
    ).size;

    document.getElementById("kpiTotalTecnicos").textContent = total;
    document.getElementById("kpiAtivosTecnicos").textContent = ativos;
    document.getElementById("kpiCidadesTecnicos").textContent = cidades;
}

function filtrarTecnicosInspetor() {

    const pesquisa =
        document.getElementById("pesquisaTecnicos")
            .value.trim().toLowerCase();

    const cidade =
        document.getElementById("filtroCidadeTecnicos")
            .value;

    const status =
        document.getElementById("filtroStatusTecnicos")
            .value;

    const lista = tecnicosInspetor.filter(t => {

        const texto = [
            t.nome,
            t.matricula,
            t.telefone,
            t.cidade
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return (
            (!pesquisa || texto.includes(pesquisa)) &&
            (!cidade || t.cidade === cidade) &&
            (!status || t.status === status)
        );
    });

    renderizarTecnicosInspetor(lista);
}

function renderizarTecnicosInspetor(lista) {

    const tbody = document.getElementById("listaTecnicosInspetor");
    const contagem = document.getElementById("contagemTecnicos");

        lista.length === 1
            ? "1 técnico exibido"
            : `${lista.length} técnicos exibidos`;

    kpiExibidos.textContent = lista.length;

    if (!lista.length) {

                </td>
            </tr>

    }

    tbody.innerHTML = lista.map(t => {

        const desligado =
            String(t.status || "")
                .toUpperCase()
                .includes("DESLIG");

        return `
            <tr>
                <td>

                <td>
                    <span class="tecnico-telefone">

                    </span>

async function abrirDetalhesTecnico(aba) {

    const modal =
        document.getElementById("modalTecnico");

    const area =
        document.getElementById("detalhesTecnico");

    modal.classList.remove("oculto");

    area.innerHTML = `
        <div class="tecnico-carregando">
            Carregando informações do técnico...
        </div>
    `;

    try {

        const dados = await apiPost({
            acao: "buscarTecnico",
            aba: aba
        });

        if (!dados.sucesso) {
            throw new Error(
                dados.mensagem ||
                "Técnico não encontrado."
            );
        }

        renderizarDetalhesTecnico(dados.tecnico);

    } catch (erro) {

        area.innerHTML = `
            <div class="tecnico-carregando">
                ⚠ ${esc(erro.message)}
            </div>
        `;
    }
}

function renderizarDetalhesTecnico(t) {

    const area =
        document.getElementById("detalhesTecnico");

    const campo = (label, valor) => `
        <div class="tecnico-campo">
            <label>${esc(label)}</label>
            <strong>${esc(valor || "-")}</strong>
        </div>
    `;

    const ferramentas =
        Array.isArray(t.ferramentas)
            ? t.ferramentas
            : [];

    let ferramentasHtml;

    if (!ferramentas.length) {

        ferramentasHtml = `
            <div class="tecnico-carregando">
                Nenhum item de ferramenta, EPI ou EPC cadastrado.
            </div>
        `;

    } else {

        /*
         * A primeira coluna fica fixa com o nome do item.
         * As inspeções ficam separadas em grupos:
         * Inspeção 1 | Validação | Data
         * Inspeção 2 | Validação | Data
         * etc.
         */
        const totalInspecoes = Math.max(
            1,
            ...ferramentas.map(f =>
                Array.isArray(f.inspecoes)
                    ? f.inspecoes.length
                    : 0
            )
        );

        const cabecalhoInspecoes = Array.from(
            { length: totalInspecoes },
            (_, indice) => `
                <th class="grupo-inspecao" colspan="2">
                    Inspeção ${indice + 1}
                </th>
            `
        ).join("");

        const subCabecalhoInspecoes = Array.from(
            { length: totalInspecoes },
            (_, indice) => `
                <th class="sub-inspecao inicio-inspecao">Validação</th>
                <th class="sub-inspecao fim-inspecao">Data</th>
            `
        ).join("");

        const linhas = ferramentas.map(f => {

            const inspecoes = Array.isArray(f.inspecoes)
                ? f.inspecoes
                : [];

            const celulasInspecoes = Array.from(
                { length: totalInspecoes },
                (_, indice) => {

                    const inspecao = inspecoes[indice];

                    if (!inspecao) {
                        return `
                            <td class="sem-dado inicio-inspecao">—</td>
                            <td class="sem-dado fim-inspecao">—</td>
                        `;
                    }

                    return `
                        <td class="valor-inspecao inicio-inspecao">
                            ${esc(inspecao.validacao || "—")}
                        </td>
                        <td class="data-inspecao fim-inspecao">
                            ${esc(inspecao.data || "—")}
                        </td>
                    `;
                }
            ).join("");

            return `
                <tr>
                    <td class="col-item">
                        <strong>${esc(f.nome || "Item")}</strong>
                    </td>
                    ${celulasInspecoes}
                </tr>
            `;
        }).join("");

        ferramentasHtml = `
            <div class="inspecoes-legenda">
                <span><strong>Controle de inspeções</strong> — cada bloco representa uma inspeção realizada.</span>
                <span>Role horizontalmente para consultar os demais períodos.</span>
            </div>

            <div class="tabela-ferramentas-wrap">
                <table class="tabela-ferramentas">

                    <thead>
                        <tr>
                            <th class="col-item">CONTROLE DE ITENS</th>
                            ${cabecalhoInspecoes}
                        </tr>
                        <tr>
                            <th class="col-item">FERRAMENTA / EPI / EPC</th>
                            ${subCabecalhoInspecoes}
                        </tr>
                    </thead>

                    <tbody>
                        ${linhas}
                    </tbody>

                </table>
            </div>
        `;
    }

    area.innerHTML = `

        <div class="tecnico-cabecalho">

            <div>
                <h2>👷 ${esc(t.nome)}</h2>
                <div class="subtitulo">
                    ${esc(t.status || "Sem status")}
                </div>
            </div>

            <button
                class="btn-secundario"
                onclick="fecharDetalhesTecnico()">
                Fechar
            </button>

        </div>

        <div class="tecnico-grid">

            ${campo("Matrícula", t.matricula)}
            ${campo("CPF", t.cpf)}
            ${campo("E-mail", t.email)}

            ${campo("Telefone", t.telefone)}
            ${campo("Cidade", t.cidade)}
            ${campo("Data de nascimento", t.nascimento)}

            ${campo("CNH", t.cnh)}
            ${campo("Número da CNH", t.numeroCnh)}
            ${campo("Vencimento da CNH", t.vencimentoCnh)}

            ${campo("Admissão", t.admissao)}
            ${campo("Últimas férias", t.ferias)}
            ${campo("Gestor", t.gestor)}

            ${campo("Inspetor", t.inspetor)}
            ${campo("Fardamento", t.fardamento)}
            ${campo("Pai", t.pai)}

            ${campo("Quantidade de calças", t.quantidadeCalca)}
            ${campo("Quantidade de batas", t.quantidadeBata)}
            ${campo("Nº da bota", t.numeroBota)}

        </div>

        <div class="tecnico-secao">

            <h3>🔧 Ferramentas e inspeções</h3>

            ${ferramentasHtml}

        </div>
    `;
}

function fecharDetalhesTecnico() {
    document.getElementById("modalTecnico")
        .classList.add("oculto");
}

function escJS(v) {
    return String(v ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}



/* =========================================================
   DATAS
========================================================= */

function formatarData(d) {

    return String(d.getDate()).padStart(2, "0") +
        "/" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "/" +
        d.getFullYear();

}


function dataISO(d) {

    return d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0");

}


/* =========================================================
   INÍCIO DA SEMANA
   Segunda-feira
========================================================= */

function inicioSemana(d) {

    let n =
        new Date(d);

    let dia =
        n.getDay();

    n.setDate(
        n.getDate() +
        (dia === 0 ? -6 : 1 - dia)
    );

    n.setHours(
        0,
        0,
        0,
        0
    );

    return n;

}

/* =========================================================
   COMUNICAÇÃO COM GOOGLE APPS SCRIPT
========================================================= */

async function apiGet() {

    const resposta =
        await fetch(
            API_URL,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    const texto =
        await resposta.text();


    if (!resposta.ok) {

        throw new Error(
            "HTTP " +
            resposta.status
        );

    }


    try {

        return JSON.parse(texto);

    } catch (e) {

        throw new Error(
            "O servidor não retornou JSON. Resposta: " +
            texto
        );

    }

}


async function apiPost(payload) {

    const resposta =
        await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    const texto =
        await resposta.text();


    if (!resposta.ok) {

        throw new Error(
            "HTTP " +
            resposta.status
        );

    }


    try {

        return JSON.parse(texto);

    } catch (e) {

        throw new Error(
            "O servidor não retornou JSON. Resposta: " +
            texto
        );

    }

}


/* =========================================================
   SINCRONIZAÇÃO
========================================================= */

async function sincronizar() {

    if (sincronizando)
        return;


    sincronizando = true;


    setStatusConexao(
        "Sincronizando com a Google Planilha...",
        "aviso"
    );


    try {

        const dados =
            await apiGet();


        if (!dados.sucesso) {

            throw new Error(
                dados.erro ||
                dados.message ||
                dados.mensagem ||
                "Falha ao buscar os dados."
            );

        }


        atividades =
            Array.isArray(
                dados.atividades
            )
                ? dados.atividades
                : [];


        bancoLocal();

        atualizarFiltroTecnicos();

        renderizar();


        setStatusConexao(
            "✓ Dados sincronizados com a Google Planilha.",
            "sucesso"
        );


    } catch (erro) {

        console.error(
            "Erro na sincronização:",
            erro
        );


        carregarCacheLocal();

        atualizarFiltroTecnicos();

        renderizar();


        setStatusConexao(
            "⚠ Sem conexão. Exibindo o último cache local.",
            "erro"
        );


    } finally {

        sincronizando =
            false;

    }

}


/* =========================================================
   LOGIN
========================================================= */

function abrirLogin() {

    document
        .getElementById(
            "modalLogin"
        )
        .classList.remove(
            "oculto"
        );


    document
        .getElementById(
            "erroLogin"
        )
        .textContent = "";


    document
        .getElementById(
            "loginUsuario"
        )
        .focus();

}


function fecharLogin() {

    document
        .getElementById(
            "modalLogin"
        )
        .classList.add(
            "oculto"
        );

}


async function login() {

    const usuarioInput =
        document
            .getElementById(
                "loginUsuario"
            )
            .value
            .trim();


    const senha =
        document
            .getElementById(
                "loginSenha"
            )
            .value;


    const erro =
        document
            .getElementById(
                "erroLogin"
            );


    const botao =
        document
            .getElementById(
                "btnEntrar"
            );


    erro.textContent = "";


    if (
        !usuarioInput ||
        !senha
    ) {

        erro.textContent =
            "Informe usuário e senha.";

        return;

    }


    botao.disabled =
        true;

    botao.textContent =
        "Entrando...";


    try {

        const dados =
            await apiPost({

                acao: "login",

                usuario:
                    usuarioInput,

                senha:
                    senha

            });


        console.log(
            "Resposta do Google Apps Script:",
            dados
        );


        if (!dados.sucesso) {

            erro.textContent =
                dados.erro ||
                dados.message ||
                dados.mensagem ||
                "O servidor recusou o login.";

            return;

        }


        if (!dados.token) {

            erro.textContent =
                "Login aceito, mas o servidor não retornou o token.";

            return;

        }


        token =
            dados.token;


        usuario =
            dados.usuario ||
            usuarioInput;


        sessionStorage.setItem(
            "agendaToken",
            token
        );


        sessionStorage.setItem(
            "agendaUsuario",
            usuario
        );


        fecharLogin();

        atualizarInterfaceLogin();


        setStatusConexao(
            "✓ Administrador conectado.",
            "sucesso"
        );


    } catch (erroCatch) {

        console.error(
            "Erro no login:",
            erroCatch
        );


        erro.textContent =
            "Não foi possível comunicar com o servidor: " +
            erroCatch.message;


    } finally {

        botao.disabled =
            false;

        botao.textContent =
            "Entrar";

    }

}


function sair() {

    token = "";

    usuario = "";

    sessionStorage.removeItem(
        "agendaToken"
    );

    sessionStorage.removeItem(
        "agendaUsuario"
    );

    idEditando = null;

    cancelarEdicao();

    atualizarInterfaceLogin();


    setStatusConexao(
        "✓ Visualização pública. Login administrativo encerrado.",
        "sucesso"
    );

}


function estaLogado() {

    return !!token;

}


function atualizarInterfaceLogin() {

    const admin =
        estaLogado();


    document
        .getElementById(
            "painelCadastro"
        )
        .classList.toggle(
            "oculto",
            !admin
        );


    document
        .getElementById(
            "btnLimpar"
        )
        .classList.toggle(
            "oculto",
            !admin
        );


    document
        .getElementById(
            "btnLogin"
        )
        .classList.toggle(
            "oculto",
            admin
        );


    document
        .getElementById(
            "btnSair"
        )
        .classList.toggle(
            "oculto",
            !admin
        );


    document
        .getElementById(
            "statusLogin"
        )
        .textContent =
        admin
            ? "👤 Administrador: " +
              usuario
            : "👤 Visualização pública";


    renderizar();

}

/* =========================================================
   ADICIONAR / EDITAR
========================================================= */

async function salvarAtividade() {

    if (!estaLogado()) {

        abrirLogin();

        return;

    }


    const data =
        document
            .getElementById(
                "data"
            )
            .value;


    const atividade =
        document
            .getElementById(
                "atividade"
            )
            .value
            .trim();


    const tecnico =
        document
            .getElementById(
                "tecnico"
            )
            .value
            .trim();


    const local =
        document
            .getElementById(
                "local"
            )
            .value
            .trim();


    const prioridade =
        document
            .getElementById(
                "prioridade"
            )
            .value;


    const status =
        document
            .getElementById(
                "status"
            )
            .value;


    if (!data) {

        alert(
            "Escolha a data da atividade."
        );

        return;

    }


   if (
    !data ||
    !atividade ||
    !tecnico ||
    !local ||
    !prioridade ||
    !status
) {

    alert(
        "Preencha todos os campos da atividade."
    );

    return;

}


    const botao =
        document.getElementById(
            "btnSalvar"
        );


    botao.disabled =
        true;


    try {

        setStatusConexao(
            idEditando !== null
                ? "Salvando alteração..."
                : "Salvando atividade...",
            "aviso"
        );


        const payload = {

            acao:
                idEditando !== null
                    ? "editar"
                    : "adicionar",

            token:
                token,

            id:
                idEditando !== null
                    ? idEditando
                    : "",

            data:
                data,

            atividade:
                atividade,

            tecnico:
                tecnico,

            local:
                local,

            prioridade:
                prioridade,

            status:
                status

        };


        const retorno =
            await apiPost(
                payload
            );


        if (!retorno.sucesso) {

            throw new Error(
                retorno.erro ||
                retorno.message ||
                retorno.mensagem ||
                "Não foi possível salvar."
            );

        }


        cancelarEdicao();


        await sincronizar();


        setStatusConexao(
            "✓ Atividade salva na Google Planilha.",
            "sucesso"
        );


    } catch (erro) {

        console.error(
            erro
        );


        if (
            String(
                erro.message
            )
            .toLowerCase()
            .includes("sessão")
        ) {

            sair();

        }


        alert(
            "Não foi possível salvar na planilha.\n\n" +
            erro.message
        );


        setStatusConexao(
            "⚠ Erro ao salvar na planilha.",
            "erro"
        );


    } finally {

        botao.disabled =
            false;

    }

}

   EDITAR ATIVIDADE
========================================================= */

function editarAtividade(id) {

    if (!estaLogado()) {

        abrirLogin();

        return;

    }


    const x =
        atividades.find(
            function(a) {

                return String(a.id) ===
                    String(id);

            }
        );

    idEditando =

    document

        .value =
        x.data;


    document
        .getElementById(
            "atividade"
        )
        .value =
        x.atividade;


    document
        .getElementById(
            "tecnico"
        )
        .value =
        x.tecnico;


    document
        .getElementById(
            "local"
        )
        .value =
        x.local || "";


    document
        .getElementById(
            "prioridade"
        )
        .value =
        x.prioridade ||
        "Média";


    document
        .getElementById(
            "status"
        )
        .value =

        "Planejado";

        .getElementById(

        )
        .innerText =

        )

    document
        .getElementById(
            "atividade"
        )
        .focus();


    renderizar();

}


/* =========================================================
   EXCLUIR
========================================================= */

async function excluirAtividade(id) {

    if (!estaLogado()) {

        abrirLogin();

        return;

    }


    if (
        !confirm(
            "Deseja excluir esta atividade?"
        )
    ) {

        return;

    }


    try {

        setStatusConexao(
            "Excluindo atividade...",
            "aviso"
        );


        const retorno =
            await apiPost({

                acao:
                    "excluir",

                token:
                    token,

                id:
                    id

            });


        if (!retorno.sucesso) {

            throw new Error(
                retorno.erro ||
                retorno.message ||
                retorno.mensagem ||
                "Não foi possível excluir."
            );

        }


        await sincronizar();


        setStatusConexao(
            "✓ Atividade excluída da planilha.",
            "sucesso"
        );


    } catch (erro) {

        console.error(
            erro
        );


        if (
            String(
                erro.message
            )
            .toLowerCase()
            .includes("sessão")
        ) {

            sair();

        }


        alert(
            "Não foi possível excluir na planilha.\n\n" +
            erro.message
        );


        setStatusConexao(
            "⚠ Erro ao excluir na planilha.",
            "erro"
        );

    }

}


/* =========================================================
   RENDERIZAÇÃO DA SEMANA
========================================================= */

function renderizar() {

    const inicio =
        inicioSemana(
            dataReferencia
        );


    const dias = [

        [
            "Segunda",
            "dataSegunda"
        ],

        [
            "Terça",
            "dataTerca"
        ],

        [
            "Quarta",
            "dataQuarta"
        ],

        [
            "Quinta",
            "dataQuinta"
        ],

        [
            "Sexta",
            "dataSexta"
        ],

        [
            "Sábado",
            "dataSabado"
        ],

        [
            "Domingo",
            "dataDomingo"
        ]

    ];


    const ft =
        document
            .getElementById(
                "filtroTecnico"
            )
            .value;


    const fs =
        document
            .getElementById(
                "filtroStatus"
            )
            .value;


    const pesquisa =
        document
            .getElementById(
                "pesquisa"
            )
            .value
            .toLowerCase()
            .trim();


    dias.forEach(
        function(d, i) {

            let data =
                new Date(
                    inicio
                );


            data.setDate(
                inicio.getDate() +
                i
            );


            document
                .getElementById(
                    d[0]
                )
                .innerHTML =
                "";


            document
                .getElementById(
                    d[1]
                )
                .innerText =
                formatarData(
                    data
                );


            let lista =
                atividades.filter(
                    function(x) {

                        return (

                            x.data ===
                            dataISO(data)

                            &&

                            (
                                !ft ||
                                x.tecnico === ft
                            )

                            &&

                            (
                                !fs ||
                                x.status === fs
                            )

                            &&

                            (
                                !pesquisa ||

                                (
                                    x.atividade +
                                    " " +
                                    x.tecnico +
                                    " " +
                                    (x.local || "")
                                )
                                .toLowerCase()
                                .includes(
                                    pesquisa
                                )
                            )

                        );

                    }
                );


            const area =
                document.getElementById(
                    d[0]
                );


            if (!lista.length) {

                area.innerHTML =
                    '<div class="vazio">' +
                    'Nenhuma atividade' +
                    '</div>';

                return;

            }


            lista.forEach(
                function(x) {

                    let div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "atividade";


                    if (
                        String(x.id) ===
                        String(idEditando)
                    ) {

                        div.classList.add(
                            "editando"
                        );

                    }


                    let st = {

                        "Planejado":
                            "planejado",

                        "Em andamento":
                            "andamento",

                        "Concluído":
                            "concluido",

                        "Pendente":
                            "pendente"

                    }[
                        x.status
                    ] || "";


                    let pc = {

                        "Alta":
                            "alta",

                        "Média":
                            "media",

                        "Baixa":
                            "baixa"

                    }[
                        x.prioridade ||
                        "Média"
                    ];


                    let botoes =
                        estaLogado()

                            ? `

                                <button
                                    class="btn-editar"
                                    onclick="editarAtividade('${String(x.id).replace(/'/g, "\\'")}')">

                                    Editar

                                </button>

                                <button
                                    class="btn-excluir"
                                    onclick="excluirAtividade('${String(x.id).replace(/'/g, "\\'")}')">

                                    Excluir

                                </button>

                            `

                            : "";


                    div.innerHTML =

                        `<strong>
                            ${esc(x.atividade)}
                        </strong>

                        <div class="tecnico">
                            👷 Técnico:
                            ${esc(x.tecnico)}
                        </div>

                        ${
                            x.local
                                ? `
                                    <div class="local">
                                        📍 ${esc(x.local)}
                                    </div>
                                  `
                                : ""
                        }

                        <div class="prioridade ${pc}">
                            ● Prioridade:
                            ${esc(
                                x.prioridade ||
                                "Média"
                            )}
                        </div>

                        <br>

                        <span class="status ${st}">
                            ${esc(
                                x.status
                            )}
                        </span>

                        <br>

                        ${botoes}`;


                    area.appendChild(
                        div
                    );

                }
            );

        }
    );


    /* MOSTRA QUAL SEMANA ESTÁ SENDO VISUALIZADA */

    let fim =
        new Date(
            inicio
        );


    fim.setDate(
        inicio.getDate() +
        6
    );


    document
        .getElementById(
            "semanaInfo"
        )
        .innerText =

        "Semana: " +
        formatarData(inicio) +
        " até " +
        formatarData(fim);

    
    atualizarResumo();

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

    document
        .getElementById(
            "total"
        )
        .innerText =
        atividades.length;


    document
        .getElementById(
            "planejados"
        )
        .innerText =

        atividades.filter(
            function(x) {

                return x.status ===
                    "Planejado";

            }
        ).length;


    document
        .getElementById(
            "andamento"
        )
        .innerText =

        atividades.filter(
            function(x) {

                return x.status ===
                    "Em andamento";

            }
        ).length;


    document
        .getElementById(
            "concluidos"
        )
        .innerText =

        atividades.filter(
            function(x) {

                return x.status ===
                    "Concluído";

            }
        ).length;


    document
        .getElementById(
            "pendentes"
        )
        .innerText =

        atividades.filter(
            function(x) {

                return x.status ===
                    "Pendente";

            }
        ).length;

}


/* =========================================================
   FILTRO DE TÉCNICOS
========================================================= */

function atualizarFiltroTecnicos() {

    const select =
        document.getElementById(
            "filtroTecnico"
        );


    const atual =
        select.value;


    const tecnicos =

        [
            ...new Set(

                atividades

                    .map(
                        function(x) {

                            return x.tecnico;

                        }
                    )

                    .filter(Boolean)

            )
        ]

        .sort(
            function(a, b) {

                return a.localeCompare(
                    b
                );

            }
        );


    select.innerHTML =
        '<option value="">' +
        'Todos os técnicos' +
        '</option>';


    tecnicos.forEach(
        function(x) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                x;

            option.textContent =
                x;


            select.appendChild(
                option
            );

        }
    );


    select.value =
        atual;

}


/* =========================================================
   NAVEGAÇÃO ENTRE SEMANAS
========================================================= */

function semanaAnterior() {

    dataReferencia.setDate(
        dataReferencia.getDate() -
        7
    );


    renderizar();

}


function proximaSemana() {

    dataReferencia.setDate(
        dataReferencia.getDate() +
        7
    );


    renderizar();

}


function irParaHoje() {

    dataReferencia =
        new Date();


    renderizar();

}


/* =========================================================
   ESCAPE DE HTML
========================================================= */

function esc(v) {

    return String(
        v ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(c) {

            return {

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#039;"

            }[c];

        }
    );

}


/* =========================================================
   EXPORTAR CSV
========================================================= */

function exportarCSV() {

    if (!atividades.length) {

        alert(
            "Não há atividades para exportar."
        );

        return;

    }


    let linhas = [

        [
            "ID",
            "Data",
            "Atividade",
            "Técnico",
            "Local",
            "Prioridade",
            "Status"
        ],

        ...atividades.map(
            function(x) {

                return [

                    x.id,

                    x.data,

                    x.atividade,

                    x.tecnico,

                    x.local || "",

                    x.prioridade ||
                        "Média",

                    x.status

                ];

            }
        )

    ];


    let csv =

        linhas

            .map(
                function(l) {

                    return l

                        .map(
                            function(v) {

                                return '"' +
                                    String(v)
                                    .replace(
                                        /"/g,
                                        '""'
                                    ) +
                                    '"';

                            }
                        )

                        .join(";");

                }
            )

            .join("\n");


    let a =
        document.createElement(
            "a"
        );


    a.href =
        URL.createObjectURL(

            new Blob(
                [
                    "\ufeff" +
                    csv
                ],

                {
                    type:
                        "text/csv;charset=utf-8"
                }
            )

        );


    a.download =
        "agenda_inspetor.csv";


    a.click();

}


/* =========================================================
   LIMPAR AGENDA
========================================================= */

async function limparAgenda() {

    if (!estaLogado()) {

        abrirLogin();

        return;

    }


    if (!atividades.length)
        return;


    if (
        !confirm(
            "Isso apagará TODAS as atividades da Google Planilha. Continuar?"
        )
    ) {

        return;

    }


    try {

        setStatusConexao(
            "Limpando agenda na planilha...",
            "aviso"
        );


        const retorno =
            await apiPost({

                acao:
                    "limpar",

                token:
                    token

            });


        if (!retorno.sucesso) {

            throw new Error(
                retorno.erro ||
                retorno.message ||
                retorno.mensagem ||
                "Não foi possível limpar."
            );

        }


        await sincronizar();

        cancelarEdicao();


        setStatusConexao(
            "✓ Agenda limpa na Google Planilha.",
            "sucesso"
        );


    } catch (erro) {

        console.error(
            erro
        );


        if (
            String(
                erro.message
            )
            .toLowerCase()
            .includes("sessão")
        ) {

            sair();

        }


        alert(
            "Não foi possível limpar a planilha.\n\n" +
            erro.message
        );


        setStatusConexao(
            "⚠ Erro ao limpar a planilha.",
            "erro"
        );

    }

}
