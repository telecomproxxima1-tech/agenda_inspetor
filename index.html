<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agenda do Inspetor</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: linear-gradient(135deg,#0756b8,#0a7cff);
  color: white;
  padding: 28px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  max-width: 1250px;
  margin: auto;
  padding: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: bold;
}

.btn-login {
  background: #0756b8;
  color: white;
}

.btn-sair {
  background: #d92d20;
  color: white;
}

.btn-adicionar {
  background: #16803c;
  color: white;
}

.btn-editar {
  background: #f79009;
  color: white;
}

.btn-excluir {
  background: #d92d20;
  color: white;
}

.status {
  background: white;
  padding: 12px 15px;
  border-radius: 8px;
  box-shadow: 0 2px 8px #00000012;
}

.cards {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px #00000012;
}

.card strong {
  display: block;
  font-size: 28px;
  color: #0756b8;
  margin-top: 8px;
}

.admin {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #00000012;
}

.form {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);
  gap: 12px;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccd5e1;
  border-radius: 8px;
  font-size: 14px;
}

label {
  font-size: 13px;
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}

.field {
  display: flex;
  flex-direction: column;
}

.full {
  grid-column: 1 / -1;
}

.filtros {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #00000012;
}

.calendario {
  display: grid;
  grid-template-columns:
    repeat(7,1fr);
  gap: 10px;
}

.dia {
  background: white;
  border-radius: 10px;
  min-height: 170px;
  padding: 10px;
  box-shadow: 0 2px 8px #00000012;
}

.dia h3 {
  margin: 0 0 10px;
  color: #0756b8;
  font-size: 15px;
}

.atividade {
  background: #edf5ff;
  border-left: 4px solid #0756b8;
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 8px;
  font-size: 13px;
}

.atividade strong {
  display: block;
}

.acoes {
  display: flex;
  gap: 5px;
  margin-top: 7px;
}

.acoes button {
  padding: 5px 8px;
  font-size: 11px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #00000080;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.modal-box {
  width: 95%;
  max-width: 400px;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

.modal-box h2 {
  margin-top: 0;
}

@media(max-width:800px) {

  .cards {
    grid-template-columns:
      repeat(2,1fr);
  }

  .form {
    grid-template-columns: 1fr;
  }

  .calendario {
    grid-template-columns: 1fr;
  }

  .dia {
    min-height: auto;
  }
}

</style>

</head>

<body>

<header>

<div class="container">

<h1>Agenda do Inspetor</h1>

<p>
Planejamento e acompanhamento semanal dos serviços
</p>

</div>

</header>


<div class="container">


<div class="topbar">

<div>

<strong id="usuarioStatus">
Modo somente leitura
</strong>

</div>

<div>

<button
id="btnLogin"
class="btn-login"
onclick="abrirLogin()">

🔐 Acesso administrativo

</button>

<button
id="btnSair"
class="btn-sair"
style="display:none"
onclick="sair()">

Sair

</button>

</div>

</div>


<div class="status">

<span id="statusConexao">
🔄 Conectando...
</span>

</div>


<br>


<div class="cards">

<div class="card">
Total de atividades
<strong id="total">0</strong>
</div>

<div class="card">
Planejadas
<strong id="planejadas">0</strong>
</div>

<div class="card">
Em andamento
<strong id="andamento">0</strong>
</div>

<div class="card">
Concluídas
<strong id="concluidas">0</strong>
</div>

</div>


<div
id="painelAdmin"
class="admin"
style="display:none">

<h2>Adicionar atividade</h2>

<div class="form">

<div class="field">

<label>Data</label>

<input
type="date"
id="data">

</div>


<div class="field">

<label>Atividade</label>

<input
type="text"
id="atividade"
placeholder="Descrição da atividade">

</div>


<div class="field">

<label>Técnico</label>

<input
type="text"
id="tecnico"
placeholder="Nome do técnico">

</div>


<div class="field">

<label>Local</label>

<input
type="text"
id="local"
placeholder="Cidade/local">

</div>


<div class="field">

<label>Prioridade</label>

<select id="prioridade">

<option>Alta</option>
<option selected>Média</option>
<option>Baixa</option>

</select>

</div>


<div class="field">

<label>Status</label>

<select id="status">

<option>Planejada</option>
<option>Em andamento</option>
<option>Concluída</option>

</select>

</div>


<div class="full">

<button
class="btn-adicionar"
onclick="salvarAtividade()">

+ Adicionar atividade

</button>

</div>

</div>

</div>


<div class="filtros">

<strong>Filtros</strong>

<br><br>

<div class="form">

<div class="field">

<label>Técnico</label>

<input
id="filtroTecnico"
oninput="renderizar()"
placeholder="Pesquisar técnico">

</div>


<div class="field">

<label>Status</label>

<select
id="filtroStatus"
onchange="renderizar()">

<option value="">Todos</option>
<option>Planejada</option>
<option>Em andamento</option>
<option>Concluída</option>

</select>

</div>


<div class="field">

<label>Pesquisar</label>

<input
id="pesquisa"
oninput="renderizar()"
placeholder="Atividade, técnico ou local">

</div>

</div>

</div>


<div id="calendario"
class="calendario">
</div>


</div>


<!-- LOGIN -->

<div
id="modalLogin"
class="modal">

<div class="modal-box">

<h2>🔐 Acesso administrativo</h2>

<div class="field">

<label>Usuário</label>

<input
type="text"
id="loginUsuario"
autocomplete="username">

</div>

<br>

<div class="field">

<label>Senha</label>

<input
type="password"
id="loginSenha"
autocomplete="current-password">

</div>

<br>

<button
class="btn-login"
onclick="login()">

Entrar

</button>

<button
onclick="fecharLogin()">

Cancelar

</button>

<p id="erroLogin"></p>

</div>

</div>


<script>

// =====================================================
// URL FIXA DO GOOGLE APPS SCRIPT
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbype0rEUpzH9VtrINs8TBf_8DywEfV1fbxq7Siox1HN4ZcNDRPb9_k0OTwN4ObGVZy_/exec";


// =====================================================
// VARIÁVEIS
// =====================================================

let atividades = [];

let token =
sessionStorage.getItem("agendaToken") || "";

let usuario =
sessionStorage.getItem("agendaUsuario") || "";


// =====================================================
// INICIALIZAÇÃO
// =====================================================

document.addEventListener(
"DOMContentLoaded",
function() {

  atualizarInterfaceLogin();

  carregarDados();

  setInterval(
    carregarDados,
    30000
  );

});


// =====================================================
// LOGIN
// =====================================================

function abrirLogin() {

  document
    .getElementById("modalLogin")
    .style.display = "flex";

  document
    .getElementById("loginUsuario")
    .focus();
}


function fecharLogin() {

  document
    .getElementById("modalLogin")
    .style.display = "none";

}


async function login() {

  const usuarioInput =
    document.getElementById("loginUsuario").value;

  const senha =
    document.getElementById("loginSenha").value;

  const erro =
    document.getElementById("erroLogin");

  erro.textContent = "";

  if (!usuarioInput || !senha) {

    erro.textContent =
      "Informe usuário e senha.";

    return;
  }

  try {

    const resposta =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          acao: "login",

          usuario: usuarioInput,

          senha: senha

        })

      });

    const dados =
      await resposta.json();

    if (!dados.sucesso) {

      erro.textContent =
        dados.erro ||
        "Login inválido.";

      return;
    }

    token = dados.token;
    usuario = dados.usuario;

    sessionStorage.setItem(
      "agendaToken",
      token
    );

    sessionStorage.setItem(
      "agendaUsuario",
      usuario
    );

    fecharLogin();

    atualizarInterfaceLogin();

    document
      .getElementById("statusConexao")
      .textContent =
      "✓ Administrador conectado";

  } catch (e) {

    erro.textContent =
      "Erro ao conectar ao servidor.";

  }

}


// =====================================================
// SAIR
// =====================================================

function sair() {

  token = "";
  usuario = "";

  sessionStorage.removeItem(
    "agendaToken"
  );

  sessionStorage.removeItem(
    "agendaUsuario"
  );

  atualizarInterfaceLogin();

  carregarDados();
}


// =====================================================
// INTERFACE DE LOGIN
// =====================================================

function atualizarInterfaceLogin() {

  const admin =
    !!token;

  document
    .getElementById("painelAdmin")
    .style.display =
    admin ? "block" : "none";

  document
    .getElementById("btnLogin")
    .style.display =
    admin ? "none" : "inline-block";

  document
    .getElementById("btnSair")
    .style.display =
    admin ? "inline-block" : "none";

  document
    .getElementById("usuarioStatus")
    .textContent =
    admin
      ? "👤 Administrador: " + usuario
      : "👁 Modo somente leitura";

  renderizar();

}


// =====================================================
// CARREGAR DA PLANILHA
// =====================================================

async function carregarDados() {

  try {

    document
      .getElementById("statusConexao")
      .textContent =
      "🔄 Sincronizando...";

    const resposta =
      await fetch(
        API_URL +
        "?t=" +
        Date.now()
      );

    const dados =
      await resposta.json();

    if (!dados.sucesso) {
      throw new Error(
        dados.erro
      );
    }

    atividades =
      dados.atividades || [];

    renderizar();

    document
      .getElementById("statusConexao")
      .textContent =
      "✓ Sincronizado com Google Planilhas";

  } catch (erro) {

    document
      .getElementById("statusConexao")
      .textContent =
      "⚠ Erro de sincronização";

  }

}


// =====================================================
// ADICIONAR
// =====================================================

async function salvarAtividade() {

  if (!token) {

    alert(
      "Faça login para adicionar atividades."
    );

    return;
  }

  const dados = {

    acao: "adicionar",

    token: token,

    data:
      document.getElementById("data").value,

    atividade:
      document.getElementById("atividade").value,

    tecnico:
      document.getElementById("tecnico").value,

    local:
      document.getElementById("local").value,

    prioridade:
      document.getElementById("prioridade").value,

    status:
      document.getElementById("status").value

  };


  if (
    !dados.data ||
    !dados.atividade
  ) {

    alert(
      "Informe pelo menos a data e a atividade."
    );

    return;
  }


  try {

    const resposta =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(dados)

      });

    const resultado =
      await resposta.json();

    if (!resultado.sucesso) {

      alert(resultado.erro);

      return;
    }

    limparFormulario();

    await carregarDados();

    alert(
      "Atividade cadastrada com sucesso!"
    );

  } catch (erro) {

    alert(
      "Não foi possível salvar a atividade."
    );

  }

}


// =====================================================
// EDITAR
// =====================================================

async function editarAtividade(id) {

  if (!token) return;

  const item =
    atividades.find(
      a => String(a.id) === String(id)
    );

  if (!item) return;


  const novaAtividade =
    prompt(
      "Atividade:",
      item.atividade
    );

  if (novaAtividade === null) return;


  const novoTecnico =
    prompt(
      "Técnico:",
      item.tecnico
    );

  if (novoTecnico === null) return;


  const novoLocal =
    prompt(
      "Local:",
      item.local
    );

  if (novoLocal === null) return;


  try {

    const resposta =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            acao: "editar",

            token: token,

            id: id,

            data: item.data,

            atividade:
              novaAtividade,

            tecnico:
              novoTecnico,

            local:
              novoLocal,

            prioridade:
              item.prioridade,

            status:
              item.status

          })

      });

    const dados =
      await resposta.json();

    if (!dados.sucesso) {

      alert(dados.erro);

      return;
    }

    carregarDados();

  } catch (erro) {

    alert(
      "Erro ao editar atividade."
    );

  }

}


// =====================================================
// EXCLUIR
// =====================================================

async function excluirAtividade(id) {

  if (!token) return;

  if (
    !confirm(
      "Deseja realmente excluir esta atividade?"
    )
  ) {
    return;
  }


  try {

    const resposta =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            acao: "excluir",

            token: token,

            id: id

          })

      });

    const dados =
      await resposta.json();

    if (!dados.sucesso) {

      alert(dados.erro);

      return;
    }

    carregarDados();

  } catch (erro) {

    alert(
      "Erro ao excluir atividade."
    );

  }

}


// =====================================================
// LIMPAR FORMULÁRIO
// =====================================================

function limparFormulario() {

  document.getElementById("data").value = "";
  document.getElementById("atividade").value = "";
  document.getElementById("tecnico").value = "";
  document.getElementById("local").value = "";

  document.getElementById("prioridade").value =
    "Média";

  document.getElementById("status").value =
    "Planejada";

}


// =====================================================
// RENDERIZAR
// =====================================================

function renderizar() {

  const calendario =
    document.getElementById("calendario");

  calendario.innerHTML = "";

  const filtroTecnico =
    (
      document.getElementById(
        "filtroTecnico"
      ).value || ""
    ).toLowerCase();

  const filtroStatus =
    document.getElementById(
      "filtroStatus"
    ).value;

  const pesquisa =
    (
      document.getElementById(
        "pesquisa"
      ).value || ""
    ).toLowerCase();


  const filtradas =
    atividades.filter(
      item => {

        const texto = (

          item.atividade +
          " " +
          item.tecnico +
          " " +
          item.local

        ).toLowerCase();

        return (

          (
            !filtroTecnico ||
            item.tecnico
              .toLowerCase()
              .includes(filtroTecnico)
          )

          &&

          (
            !filtroStatus ||
            item.status === filtroStatus
          )

          &&

          (
            !pesquisa ||
            texto.includes(pesquisa)
          )

        );

      }
    );


  atualizarCards();


  const hoje =
    new Date();

  hoje.setHours(0,0,0,0);


  // Segunda-feira da semana atual
  const segunda =
    new Date(hoje);

  const diaSemana =
    segunda.getDay();

  const diferenca =
    diaSemana === 0
      ? -6
      : 1 - diaSemana;

  segunda.setDate(
    segunda.getDate() + diferenca
  );


  const nomesDias = [
    "Segunda",
    "Terça",
    "Quarta",
    "Quinta",
    "Sexta",
    "Sábado",
    "Domingo"
  ];


  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const data =
      new Date(segunda);

    data.setDate(
      segunda.getDate() + i
    );

    const dataISO =
      data.toISOString()
        .split("T")[0];


    const div =
      document.createElement("div");

    div.className = "dia";


    div.innerHTML =
      "<h3>" +
      nomesDias[i] +
      " — " +
      data.toLocaleDateString(
        "pt-BR"
      ) +
      "</h3>";


    const doDia =
      filtradas.filter(
        a =>
          a.data === dataISO
      );


    doDia.forEach(
      item => {

        const box =
          document.createElement(
            "div"
          );

        box.className =
          "atividade";


        let html =

          "<strong>" +
          escapeHtml(
            item.atividade
          ) +
          "</strong>" +

          "<div>👤 " +
          escapeHtml(
            item.tecnico
          ) +
          "</div>" +

          "<div>📍 " +
          escapeHtml(
            item.local
          ) +
          "</div>" +

          "<div>📌 " +
          escapeHtml(
            item.status
          ) +
          "</div>" +

          "<div>⚡ " +
          escapeHtml(
            item.prioridade
          ) +
          "</div>";


        if (token) {

          html +=

            "<div class='acoes'>" +

            "<button class='btn-editar' " +
            "onclick=\"editarAtividade('" +
            item.id +
            "')\">" +
            "Editar" +
            "</button>" +

            "<button class='btn-excluir' " +
            "onclick=\"excluirAtividade('" +
            item.id +
            "')\">" +
            "Excluir" +
            "</button>" +

            "</div>";

        }


        box.innerHTML =
          html;

        div.appendChild(
          box
        );

      }
    );


    calendario.appendChild(
      div
    );

  }

}
  
<div class="navegacao">
    <button class="btn-semana" onclick="semanaAnterior()">
        ◀ Semana anterior
    </button>

    <button class="btn-hoje" onclick="irParaHoje()">
        📅 Semana atual
    </button>

    <button class="btn-semana" onclick="proximaSemana()">
        Próxima semana ▶
    </button>
</div>

<div class="semana-info" id="semanaInfo"></div>

// =====================================================
// CARDS
// =====================================================

function atualizarCards() {

  document.getElementById(
    "total"
  ).textContent =
    atividades.length;

  document.getElementById(
    "planejadas"
  ).textContent =
    atividades.filter(
      a =>
        a.status === "Planejada"
    ).length;

  document.getElementById(
    "andamento"
  ).textContent =
    atividades.filter(
      a =>
        a.status === "Em andamento"
    ).length;

  document.getElementById(
    "concluidas"
  ).textContent =
    atividades.filter(
      a =>
        a.status === "Concluída"
    ).length;

}


// =====================================================
// PROTEÇÃO CONTRA HTML INJETADO
// =====================================================

function escapeHtml(text) {

  return String(text || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
